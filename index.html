<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#2a1160">
<title>Team Quiz</title>
<link rel="preload" href="fonts/montserrat.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="backdrop"></div>

<!-- Step 1: PIN -->
<section class="screen p-screen" id="scr-pin">
  <div class="p-center">
    <div class="logo xl">Team<span>Quiz</span></div>
    <div class="card join-card" style="width:min(420px,94vw)">
      <div class="lbl">Game PIN</div>
      <input type="text" id="in-pin" class="code-input" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="off">
      <div class="join-err" id="pin-err"></div>
      <button class="go big" id="btn-pin">Enter</button>
    </div>
    <a href="host.html" style="opacity:.6;font-size:14px">I'm the host</a>
  </div>
</section>

<!-- Step 2: nickname + avatar -->
<section class="screen p-screen" id="scr-join" hidden>
  <div class="p-center">
    <div class="card join-card">
      <div class="row" style="justify-content:space-between">
        <span class="lbl">Game PIN <b id="pin-show" style="color:var(--ink);letter-spacing:2px"></b></span>
        <button class="small" id="btn-change-pin" style="box-shadow:none;background:#f1eef8">Change</button>
      </div>
      <div class="av-preview" id="av-preview"></div>
      <div class="lbl">Nickname</div>
      <input type="text" id="in-name" maxlength="16" placeholder="Your name" autocomplete="off">
      <div class="lbl">Pick your character</div>
      <div class="av-tabs" id="av-tabs"></div>
      <div class="av-grid" id="av-grid"></div>
      <div class="lbl">Background colour</div>
      <div class="col-grid" id="col-grid"></div>
      <div class="join-err" id="join-err"></div>
      <button class="go big" id="btn-join">Join game</button>
    </div>
  </div>
</section>

<!-- Waiting / lobby / locked / standings -->
<section class="screen p-screen" id="scr-wait" hidden>
  <div class="p-top"><span id="w-progress"></span><span id="w-title" style="opacity:.8"></span></div>
  <div class="p-center" id="w-body"></div>
  <div class="p-bottom"><span id="w-me" class="row" style="gap:10px"></span><span class="score" id="w-score">0</span></div>
</section>

<!-- Question -->
<section class="screen p-screen" id="scr-question" hidden>
  <div class="p-top"><span id="q-progress"></span><span class="p-timer" id="q-timer">20</span></div>
  <div class="p-qtext" id="q-text"></div>
  <div class="p-answers" id="q-answers"></div>
  <div class="p-bottom"><span id="q-me" class="row" style="gap:10px"></span><span class="score" id="q-score">0</span></div>
</section>

<!-- Result -->
<section class="screen p-screen p-result" id="scr-result" hidden>
  <div class="p-top"><span id="r-progress"></span><span></span></div>
  <div class="p-center" id="r-body"></div>
  <div class="p-bottom"><span id="r-me" class="row" style="gap:10px"></span><span class="score" id="r-score">0</span></div>
</section>

<div class="overlay" id="reconnect" hidden>
  <div class="spinner"></div>
  <div id="reconnect-text">Connection lost. Reconnecting…</div>
  <button class="ghost small" id="btn-leave">Leave game</button>
</div>

<script src="js/vendor/peerjs.min.js"></script>
<script src="js/link.js"></script>
<script src="js/config.js"></script>
<script src="js/avatars.js"></script>
<script src="js/common.js"></script>
<script src="js/player.js"></script>
</body>
</html>
